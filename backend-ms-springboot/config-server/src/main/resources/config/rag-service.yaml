server:
  port: 8083

app:
  ask:
    # Cadena de fallback ante 429/503/timeouts del primario (nombres del enum
    # GoogleGenAiChatModel.ChatModel; vacía = solo primario). Orden: mayor RPD primero.
    fallback-models: GEMINI_3_5_FLASH_LITE,GEMINI_3_1_FLASH_LITE

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  issuer: prompt_sec_auth_ms

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/prompt_sec_rag_ms
    username: postgres
    password: postgres

  ai:
    model:
      # Selector que enciende el embedding de Google (spring.ai.model.embedding.text)
      embedding.text: google-genai
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        embedding:
          api-key: ${GOOGLE_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 768
            task-type: RETRIEVAL_DOCUMENT
        chat:
          options:
            model: gemini-3.5-flash
            temperature: 0.1
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:certs/public.pem

  rabbitmq:
    host: localhost
    port: 5672
    username: rabbit
    password: rabbit
    # Reintentos en memoria (Boot 4: "max-retries" son reintentos ADICIONALES;
    # total de entregas por mensaje = 1 intento inicial + max-retries = 3 aquí).
    # Agotados, rechaza sin reencolar (sin DLQ: se descarta).
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2

  data:
    redis:
      host: localhost
      port: 6379
      password: redis