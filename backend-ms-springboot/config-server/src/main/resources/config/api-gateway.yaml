server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  issuer: prompt_sec_auth_ms

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:certs/public.pem

  data:
    redis:
      host: localhost
      port: 6379
      password: redis

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
            - id: document-service
              uri: lb://document-service
              predicates:
                - Path=/api/v1/documents/**
            - id: rag-service
              uri: lb://rag-service
              predicates:
                - Path=/api/v1/rag/**