services:
  postgres:
    image: postgres:17
    ports:
      - "${POSTGRESQL_DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRESQL_DB_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRESQL_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongodb:
    image: mongo:7.0.12
    ports:
      - "${MONGO_DB_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  config-server:
    build:
      context: .
      dockerfile: ./config-server/Dockerfile
    ports:
      - "${CONFIG_SERVER_PORT}:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://config-server:8888/actuator/health"]
      interval: 20s
      timeout: 3s
      retries: 5
    restart: on-failure

  discovery-server:
    build:
      context: .
      dockerfile: ./discovery-server/Dockerfile
    ports:
      - "${DISCOVERY_SERVER_PORT}:8761"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery-server:8761/actuator/health"]
      interval: 20s
      timeout: 3s
      retries: 5
    restart: on-failure

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    ports:
      - "${API_GATEWAY_PORT}:8080"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      document-service:
        condition: service_started
      rag-service:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://api-gateway:8080/actuator/health"]
      interval: 20s
      timeout: 3s
      retries: 5
    restart: on-failure

  auth-service:
    build:
      context: .
      dockerfile: ./microservices/auth-service/Dockerfile
    ports:
      - "${AUTH_SERVICE_PORT}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://discovery-server:8761/eureka/"}}}}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${AUTH_SERVICE_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${POSTGRESQL_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRESQL_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    healthcheck:
      test: ["CMD", "curl", "-f", "http://auth-service:8081/actuator/health"]
      interval: 20s
      timeout: 3s
      retries: 5
    restart: on-failure

  document-service:
    build:
      context: .
      dockerfile: ./microservices/document-service/Dockerfile
    ports:
      - "${DOCUMENT_SERVICE_PORT}:8082"
    depends_on:
      mongodb:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://discovery-server:8761/eureka/"}}}}
      - SPRING_MONGODB_URI=mongodb://${MONGO_DB_USERNAME}:${MONGO_DB_PASSWORD}@mongodb:27017/${DOCUMENT_SERVICE_DB_NAME}?authSource=admin
    restart: on-failure

  postgres-rag:
    image: pgvector/pgvector:pg17
    ports:
      - "${RAG_POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRESQL_DB_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRESQL_DB_PASSWORD}
      POSTGRES_DB: ${RAG_SERVICE_DB_NAME}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure

  rag-service:
    build:
      context: .
      dockerfile: ./microservices/rag-service/Dockerfile
    ports:
      - "${RAG_SERVICE_PORT}:8083"
    depends_on:
      postgres-rag:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_APPLICATION_JSON={"eureka":{"client":{"service-url":{"defaultZone":"http://discovery-server:8761/eureka/"}}}}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-rag:5432/${RAG_SERVICE_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${POSTGRESQL_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRESQL_DB_PASSWORD}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    restart: on-failure


volumes:
  postgres-data:
  mongo-data:
  pgvector-data: